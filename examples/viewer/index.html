<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>load3d viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #20242a; color: #e8eaed; font: 14px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    header { position: fixed; top: 0; left: 0; right: 0; padding: 10px 16px; background: #20242acc; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    #info { opacity: 0.85; overflow-wrap: anywhere; }
    body.dropping canvas { outline: 3px dashed #8ab4f8; outline-offset: -12px; }
  </style>
</head>
<body>
  <header>
    <input id="file" type="file" accept=".fbx,.obj,.3ds">
    <span id="info">Pick or drop an FBX, .obj or 3D Studio file. Drag to turn it, scroll to zoom.</span>
  </header>
  <canvas id="view"></canvas>
  <script type="module" src="viewer.js"></script>
</body>
</html>
